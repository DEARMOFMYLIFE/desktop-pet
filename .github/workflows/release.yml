name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: ""
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: cargo fmt --manifest-path backend/Cargo.toml --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "XiaoZhu ${{ github.ref_name }}"
          releaseBody: |
            XiaoZhu desktop companion — unsigned builds.

            - Windows: NSIS / MSI
            - macOS: DMG (x64 and arm64)
            - Linux: AppImage / deb

            Verify downloads with `SHA256SUMS-*.txt`.
            See README for install notes and known limitations.
          releaseDraft: true
          prerelease: false
          tauriScript: npm run tauri --
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Checksums
        run: node scripts/checksums.mjs "SHA256SUMS-${{ matrix.os }}-${{ matrix.target || 'native' }}.txt"

      - name: Upload checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: SHA256SUMS-*.txt
